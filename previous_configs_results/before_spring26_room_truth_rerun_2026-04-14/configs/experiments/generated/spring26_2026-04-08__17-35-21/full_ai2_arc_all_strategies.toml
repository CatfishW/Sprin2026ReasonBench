[dataset]
kind = "ai2_arc"
local_path = "data/ai2_arc/ai2_arc_full.jsonl"
split = "full"
shuffle = false
seed = 23

[client]
kind = "openai_compatible"
base_url = "https://game.agaii.org/llm/v1/chat/completions"
model = "/home/tang/Models/Qwen3.5-4B"
api_key_env = "OPENAI_API_KEY"
timeout_s = 240
default_temperature = 1.0
default_max_tokens = 1024
max_retries = 6
min_request_interval_s = 0.08
loop_retries = 3

[client.extra_payload]
top_p = 0.95
top_k = 20
presence_penalty = 1.5
repetition_penalty = 1.0

[client.extra_payload.extra_body]
thinking_budget = 512

[run]
experiment_name = "ai2_arc_full_all_strategies__spring26_2026-04-08__17-35-21"
max_workers = 4
strict_benchmark_mode = true
enable_cache = true
enable_checkpoint = true
enable_leakage_check = true

[output]
output_dir = "outputs/full_ai2_arc__spring26_2026-04-08__17-35-21"
cache_path = "outputs/full_ai2_arc__spring26_2026-04-08__17-35-21/cache.sqlite"
checkpoint_path = "outputs/full_ai2_arc__spring26_2026-04-08__17-35-21/results.jsonl"
summary_path = "outputs/full_ai2_arc__spring26_2026-04-08__17-35-21/summary.csv"
manifest_path = "outputs/full_ai2_arc__spring26_2026-04-08__17-35-21/manifest.json"

[strategies.direct]
enabled = true

[strategies.concise_cot]
enabled = true

[strategies.least_to_most]
enabled = true

[strategies.constraint_decompose]
enabled = true

[strategies.self_verify]
enabled = true

[strategies.critique_refine]
enabled = true

[strategies.self_consistency]
enabled = true
num_samples = 3
temperature = 0.7

[strategies.selective_self_consistency]
enabled = true
num_samples = 3
temperature = 0.7

[strategies.budgeted_cascade]
enabled = true

[strategies.few_shot_exemplar]
enabled = true
demo_path = "data/external_demos/general_reasoning.jsonl"
